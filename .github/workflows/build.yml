name: Build macOS app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rumps pyobjc-framework-Quartz pyobjc-framework-Cocoa pyinstaller
      - run: pyinstaller --noconfirm MouseJiggler.spec
      - name: Ad-hoc sign the app
        run: codesign --force --deep --sign - dist/MouseJiggler.app
      - name: Smoke test (prints errors if the app crashes on launch)
        continue-on-error: true
        run: |
          dist/MouseJiggler.app/Contents/MacOS/MouseJiggler > run.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "APP STAYED RUNNING"; kill $PID; else echo "APP CRASHED"; fi
          cat run.log
      - run: ditto -c -k --keepParent dist/MouseJiggler.app MouseJiggler-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-mac
          path: MouseJiggler-mac.zip
