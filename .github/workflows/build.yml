name: Build macOS app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rumps pyobjc-framework-Quartz pyinstaller
      - run: pyinstaller --noconfirm MouseJiggler.spec
      - run: ditto -c -k --keepParent dist/MouseJiggler.app MouseJiggler-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-mac
          path: MouseJiggler-mac.zip
